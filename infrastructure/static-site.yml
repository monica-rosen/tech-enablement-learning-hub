AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 and CloudFront hosting for the Tech Enablement Learning Hub

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom hostname, for example learn.theconnectivetissue.co
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN from us-east-1 for the custom hostname
  SubscriberSenderEmail:
    Type: String
    Default: learn@theconnectivetissue.co
    Description: Verified Amazon SES sender used for confirmation emails
  SubscriberEmailDomain:
    Type: String
    Default: theconnectivetissue.co
    Description: Domain identity verified with Amazon SES for sending
  SubscriberAllowedOrigin:
    Type: String
    Default: https://learn.theconnectivetissue.co
    Description: Website origin allowed to submit subscription requests

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Access from CloudFront to the private learning-hub bucket
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        Comment: Tech Enablement Learning Hub
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: site-bucket
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  SubscriberContactList:
    Type: AWS::SES::ContactList
    Properties:
      ContactListName: tech-enablement-learning-hub
      Description: Confirmed subscribers to the Tech Enablement Learning Hub
      Topics:
        - TopicName: new-lessons
          DisplayName: New learning-hub lessons
          Description: New interactive technical lessons and practical explainers
          DefaultSubscriptionStatus: OPT_IN

  SubscriberEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SubscriberEmailDomain

  SubscriberConfirmationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  SubscriberFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ManageSubscriberConfirmations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt SubscriberConfirmationTable.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:CreateContact
                  - ses:UpdateContact
                Resource: "*"

  SubscriberFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Confirmed opt-in registration for the Tech Enablement Learning Hub
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SubscriberFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref SubscriberConfirmationTable
          CONTACT_LIST: !Ref SubscriberContactList
          CONTACT_TOPIC: new-lessons
          SENDER_EMAIL: !Ref SubscriberSenderEmail
          ALLOWED_ORIGIN: !Ref SubscriberAllowedOrigin
          SITE_URL: !Ref SubscriberAllowedOrigin
      Code:
        ZipFile: |
          const crypto = require("node:crypto");
          const { DynamoDBClient, PutItemCommand, GetItemCommand, DeleteItemCommand } = require("@aws-sdk/client-dynamodb");
          const { SESv2Client, SendEmailCommand, CreateContactCommand, UpdateContactCommand } = require("@aws-sdk/client-sesv2");
          const db = new DynamoDBClient({});
          const ses = new SESv2Client({});
          const json = (statusCode, body) => ({ statusCode, headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
          exports.handler = async (event) => {
            const method = event.requestContext?.http?.method || "";
            if (method === "POST") {
              const origin = event.headers?.origin || event.headers?.Origin;
              if (origin && origin !== process.env.ALLOWED_ORIGIN) return json(403, { message: "Origin not allowed" });
              let input;
              try { input = JSON.parse(event.body || "{}"); } catch { return json(400, { message: "Invalid request" }); }
              if (input.website) return json(202, { message: "Check your inbox" });
              const email = String(input.email || "").trim().toLowerCase();
              if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 254) return json(400, { message: "Enter a valid email" });
              const token = crypto.randomUUID();
              const expiresAt = Math.floor(Date.now() / 1000) + 86400;
              await db.send(new PutItemCommand({ TableName: process.env.TABLE_NAME, Item: { token: { S: token }, email: { S: email }, expiresAt: { N: String(expiresAt) } } }));
              const endpoint = `https://${event.requestContext.domainName}/confirm?token=${encodeURIComponent(token)}`;
              try {
                await ses.send(new SendEmailCommand({
                  FromEmailAddress: process.env.SENDER_EMAIL,
                  Destination: { ToAddresses: [email] },
                  Content: { Simple: {
                    Subject: { Data: "Confirm your Tech Enablement subscription" },
                    Body: {
                      Text: { Data: `Confirm your subscription: ${endpoint}\n\nThis link expires in 24 hours.` },
                      Html: { Data: `<h1>One quick confirmation</h1><p>Confirm that you want new Tech Enablement lessons by email.</p><p><a href="${endpoint}">Confirm subscription</a></p><p>This link expires in 24 hours.</p>` }
                    }
                  } }
                }));
              } catch (error) {
                await db.send(new DeleteItemCommand({ TableName: process.env.TABLE_NAME, Key: { token: { S: token } } }));
                throw error;
              }
              return json(202, { message: "Check your inbox" });
            }
            if (method === "GET") {
              const token = event.queryStringParameters?.token;
              if (!token) return json(400, { message: "Missing confirmation token" });
              const result = await db.send(new GetItemCommand({ TableName: process.env.TABLE_NAME, Key: { token: { S: token } }, ConsistentRead: true }));
              const email = result.Item?.email?.S;
              const expiresAt = Number(result.Item?.expiresAt?.N || 0);
              if (!email || expiresAt < Math.floor(Date.now() / 1000)) return json(400, { message: "This confirmation link has expired" });
              const preferences = [{ TopicName: process.env.CONTACT_TOPIC, SubscriptionStatus: "OPT_IN" }];
              try {
                await ses.send(new CreateContactCommand({ ContactListName: process.env.CONTACT_LIST, EmailAddress: email, UnsubscribeAll: false, TopicPreferences: preferences, AttributesData: JSON.stringify({ source: "learning-hub" }) }));
              } catch (error) {
                if (error.name !== "AlreadyExistsException") throw error;
                await ses.send(new UpdateContactCommand({ ContactListName: process.env.CONTACT_LIST, EmailAddress: email, UnsubscribeAll: false, TopicPreferences: preferences, AttributesData: JSON.stringify({ source: "learning-hub" }) }));
              }
              await db.send(new DeleteItemCommand({ TableName: process.env.TABLE_NAME, Key: { token: { S: token } } }));
              return { statusCode: 302, headers: { location: `${process.env.SITE_URL}/?subscribed=1#subscribe` }, body: "" };
            }
            return json(405, { message: "Method not allowed" });
          };

  SubscriberApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: tech-enablement-subscriber-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref SubscriberAllowedOrigin
        AllowMethods:
          - POST
          - GET
        AllowHeaders:
          - content-type
        MaxAge: 86400

  SubscriberApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SubscriberApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SubscriberFunction.Arn
      PayloadFormatVersion: "2.0"

  SubscriberPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SubscriberApi
      RouteKey: POST /subscribe
      Target: !Sub integrations/${SubscriberApiIntegration}

  SubscriberConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SubscriberApi
      RouteKey: GET /confirm
      Target: !Sub integrations/${SubscriberApiIntegration}

  SubscriberApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SubscriberApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 3
        ThrottlingRateLimit: 1

  SubscriberFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SubscriberFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SubscriberApi}/*/*

Outputs:
  BucketName:
    Description: Deployment destination for the generated static files
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID used for cache refreshes
    Value: !Ref Distribution
  CloudFrontDomainName:
    Description: Temporary address to test before changing Wix DNS
    Value: !GetAtt Distribution.DomainName
  SubscriberFunctionUrl:
    Description: Add this value to the GitHub repository variable AWS_SUBSCRIBE_URL
    Value: !Sub https://${SubscriberApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/subscribe
  SubscriberContactListName:
    Description: Amazon SES contact list containing confirmed subscribers
    Value: !Ref SubscriberContactList
  SubscriberDkimName1:
    Description: First Wix DNS CNAME name for SES verification
    Value: !GetAtt SubscriberEmailIdentity.DkimDNSTokenName1
  SubscriberDkimValue1:
    Description: First Wix DNS CNAME value for SES verification
    Value: !GetAtt SubscriberEmailIdentity.DkimDNSTokenValue1
  SubscriberDkimName2:
    Description: Second Wix DNS CNAME name for SES verification
    Value: !GetAtt SubscriberEmailIdentity.DkimDNSTokenName2
  SubscriberDkimValue2:
    Description: Second Wix DNS CNAME value for SES verification
    Value: !GetAtt SubscriberEmailIdentity.DkimDNSTokenValue2
  SubscriberDkimName3:
    Description: Third Wix DNS CNAME name for SES verification
    Value: !GetAtt SubscriberEmailIdentity.DkimDNSTokenName3
  SubscriberDkimValue3:
    Description: Third Wix DNS CNAME value for SES verification
    Value: !GetAtt SubscriberEmailIdentity.DkimDNSTokenValue3
